[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sifrekontrol"
version = "0.1.0"
description = "Tamamen lokal çalışan şifre güvenlik denetleyicisi (HIBP offline veri seti + regülasyon uyumluluğu)"
requires-python = ">=3.9"
dependencies = [
    "zxcvbn>=4.4.28",
]

[project.scripts]
sifrekontrol = "sifrekontrol.cli:main"

[tool.setuptools.packages.find]
include = ["sifrekontrol*"]
